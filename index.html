  cameraTarget.set(state.x*.46,state.y+6.6,state.z+11.5);camera.position.lerp(cameraTarget,Math.min(1,dt*3.2));camera.lookAt(state.x,state.y+1.05,state.z-1.6);
  const secs=Math.floor((performance.now()-state.started)/1000);document.getElementById('time').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  for(const [id,p] of peers){if(performance.now()-p.seen>5000){peers.delete(id);const av=remoteMeshes.get(id);if(av){scene.remove(av.group);remoteMeshes.delete(id)}}}if(performance.now()-lastBroadcast>80){lastBroadcast=performance.now();const packet={type:'runner',id:myId,x:state.x,y:state.y,z:state.z,rot:moveAngle};room.postMessage(packet);if(hostPeer){for(const conn of netConnections.values())if(conn.open)conn.send(packet)}else if(hostConnection?.open)hostConnection.send(packet);document.getElementById('room-count').textContent=String(1+peers.size)}
  renderer.render(scene,camera)}
frame();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
